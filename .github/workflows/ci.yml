name: artifact-ci

on:
  push:
  pull_request:

jobs:
  offline-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install pytest pydantic requests python-dotenv biopython
      - name: Run reliability and biomedical tests
        run: |
          python -m pytest \
            tests/test_benchmark_runner.py \
            tests/test_failure_taxonomy_v3_generator.py \
            tests/test_evidence_corruption_runner.py \
            tests/test_repair_budget_runner.py \
            tests/test_repair_quality_builder.py \
            tests/test_trace_consistency_audit_runner.py \
            tests/test_tool_menu_comparison_runner.py \
            tests/test_external_tool_adapter.py \
            tests/test_public_examples.py \
            tests/test_clinical_trial_verifier.py \
            tests/test_drug_target_verifier.py
      - name: Run release audit
        run: python scripts/audit_release_tree.py --root .
      - name: Run offline artifact smoke
        run: |
          python scripts/run_offline_artifact.py \
            --output-dir /tmp/egvr_artifact \
            --bootstrap-samples 1000
      - name: Verify standalone wheel contents
        run: |
          rm -rf build /tmp/egvr-dist
          python -m pip wheel . --no-deps --no-build-isolation -w /tmp/egvr-dist
          python scripts/verify_wheel_contents.py /tmp/egvr-dist/*.whl
