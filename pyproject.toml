[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egvr-agent"
version = "0.2.0"
description = "Evidence-first planning, execution-grounded verification, and targeted repair for biomedical tool-using agents"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "EGVR-Agent Contributors"}
]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/lulaiao/EGVR-Agent"
Repository = "https://github.com/lulaiao/EGVR-Agent"
Issues = "https://github.com/lulaiao/EGVR-Agent/issues"

[project.optional-dependencies]
chemistry = [
    "rdkit",
    "biopython>=1.80",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[project.scripts]
egvr-benchmark = "egvr.benchmark_runner:main"
egvr-router = "egvr.llm_router_baseline_runner:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["egvr*"]
exclude = ["tests*", "tutorials*", "example*", "docs*"]

[tool.setuptools.package-data]
"egvr" = ["benchmarks/*.jsonl", "configs/*.json", "*.md"]

# ---------------------------------------------------------------------------
# Ruff linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E",      # Pycodestyle errors
    "W",      # Pycodestyle warnings
    "I",      # isort
    "B",      # flake8-bugbear
    "TID",    # flake8-tidy-imports
    "C4",     # flake8-comprehensions
    "BLE",    # flake8-blind-except
    "UP",     # pyupgrade
    "RUF100", # Unused noqa
    "TCH",    # Typing imports
]
ignore = [
    "E501",   # line too long
    "E731",   # lambda assignment
    "E741",   # ambiguous variable names (I, O, l)
    "D104", "D100", "D107", "D105", "D400", "D401", "D203", "D213",
    "B008",   # function call in default argument
    "N813",   # camelcase imported as lowercase
    "E402",   # module import not at top of file
    "PLR0913", "PLR0912", "PLR2004", "PLR0915",
    "PLC0206", "PLC0415",
    "BLE001", # blind exception
    "B005",
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/scripts"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (requires kernel operations or real LLM)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
